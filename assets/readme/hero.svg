<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Agent Engineering — Building Reliable AI Agents: From Reasoning to Production</title>
  <desc id="heroDesc">书脊上写着书名的开源教材：14 章分为五部分——基础篇、推理与规划篇、核心工程篇、评估与安全篇、进化与部署篇。章节阶梯共 14 级，其中前 2 级（已成稿）为铜色，其余 12 级为大纲。</desc>

  <rect width="1200" height="420" rx="20" fill="#F4EDE0"/>

  <g id="book-spine">
    <rect x="56" y="44" width="200" height="332" rx="10" fill="#7B2D26"/>
    <rect x="56" y="44" width="8" height="332" rx="4" fill="#66241E"/>
    <g id="spine-title" transform="translate(156 210) rotate(-90)" text-anchor="middle"
       font-family="Georgia, 'Songti SC', 'Times New Roman', serif" font-size="32"
       letter-spacing="2.5" fill="#F4EDE0">
      <text x="0" y="-14">AGENT</text>
      <text x="0" y="32">ENGINEERING</text>
    </g>
    <rect x="96" y="374" width="120" height="3" fill="#B9862F"/>
  </g>

  <g id="cover-copy">
    <text x="352" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="20" letter-spacing="2" fill="#6E6555">AI AGENT 工程 · 开源教材</text>
    <text x="352" y="140" font-family="Georgia, 'Songti SC', 'Times New Roman', serif" font-size="32" fill="#241F19">Building Reliable AI Agents</text>
    <text x="352" y="180" font-family="Georgia, 'Songti SC', 'Times New Roman', serif" font-size="32" fill="#241F19">From Reasoning to Production</text>
  </g>

  <g id="legend" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6E6555">
    <rect x="894" y="74" width="12" height="12" rx="2" fill="#B9862F"/>
    <text x="914" y="85">已成稿 2 章</text>
    <rect x="1038" y="74" width="12" height="12" rx="2" fill="#E9E0CE" stroke="#241F19" stroke-width="2"/>
    <text x="1058" y="85">共 14 章</text>
  </g>

